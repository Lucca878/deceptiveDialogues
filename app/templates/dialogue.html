<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialogue | Deceptive Dialogues</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="chat-page">
    <h1 class="visually-hidden">Dialogue</h1>
    <p class="role-announcement" aria-live="polite">
      Your role: <strong id="role-name"></strong>
    </p>

    <section class="chat-panel" aria-label="Chat">
      <div class="question-progress" id="question-progress" hidden>
        <div class="question-progress__labels">
          <p class="question-counter" id="question-counter" aria-live="polite"></p>
          <span class="question-progress__note" id="question-progress-note"></span>
        </div>
        <div class="question-progress__track" id="question-progress-track" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <span id="question-progress-fill"></span>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages" aria-live="polite">
        <p class="chat-empty" id="chat-empty">Send a message to begin.</p>
      </div>

      <p class="chat-typing" id="chat-typing" hidden>
        <span class="visually-hidden">The other participant is typing.</span>
        <span class="chat-typing-dot" aria-hidden="true"></span>
        <span class="chat-typing-dot" aria-hidden="true"></span>
        <span class="chat-typing-dot" aria-hidden="true"></span>
      </p>

      <form class="chat-composer" id="chat-form">
        <label class="visually-hidden" for="chat-input">Message</label>
        <input id="chat-input" name="message" type="text" placeholder="Waiting for the interviewee to start..." autocomplete="off" required disabled>
        <button class="chat-send" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/dialogue.js') }}" defer></script> <!-- Loads the JavaScript for handling the dialogue page interactions -->
</body>
</html>
