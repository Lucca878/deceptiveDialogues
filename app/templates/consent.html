<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Information and Consent | The Deception Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="consent-page">
    <section class="consent-card" aria-labelledby="consent-title">
      <p class="room-eyebrow">THE DECEPTION GAME</p>
      <h1 id="consent-title">Information and Consent</h1>

      <div class="consent-content">
        {% include "participant_materials/consent.html" %}
      </div>

      <form class="consent-actions" method="post" action="{{ url_for('consent_decision') }}">
        <button class="button button-agree" type="submit" name="decision" value="accept">Agree</button>
        <button class="button button-deny" type="submit" name="decision" value="deny">Deny</button>
      </form>
    </section>
  </main>
</body>
</html>
